<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"
     role="img" aria-label="Product photograph not yet available">
  <title>Product photograph not yet available</title>

  <rect width="800" height="600" fill="#f6f1ea"/>
  <rect x="0.5" y="0.5" width="799" height="599" fill="none"
        stroke="#1a1a1a" stroke-opacity="0.22"/>

  <!-- Masthead spectrum, cropped to a corner mark -->
  <g>
    <rect x="0" y="0" width="52" height="6" fill="#ffb347"/>
    <rect x="52" y="0" width="52" height="6" fill="#f47742"/>
    <rect x="104" y="0" width="52" height="6" fill="#db3550"/>
    <rect x="156" y="0" width="52" height="6" fill="#73b9ca"/>
    <rect x="208" y="0" width="52" height="6" fill="#0092b2"/>
  </g>

  <!-- Aperture mark: a lens seen down its own axis -->
  <g transform="translate(400 272)" fill="none" stroke="#0092b2">
    <circle r="86" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="52" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M-118 0h40M78 0h40M0 -118v40M0 78v40"
          stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <text x="400" y="434" text-anchor="middle" fill="#5b5651"
        font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="26">Photograph to follow</text>
</svg>

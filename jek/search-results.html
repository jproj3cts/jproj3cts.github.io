# processed by Jekyll for the shared nav (_includes/site-nav.html) and the jek.css stamp (css_v in _config.yml)
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JEK Systems - Search Results</title>
<link rel="icon" type="image/png" href="/jek/assets/img/favicon.png">
<link rel="stylesheet" href="/jek/assets/css/jek.css?v={{ site.css_v }}">
</head>
<body>

  <!-- Top Header -->
  {% include site-nav.html %}

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title" data-eyebrow="Search">Search Results</h1>
    <div id="results"></div>
    <a href="/jek/" class="return">← Return to Home</a>
  </main>

<footer>
  <a href="/jek/">
    <img src="/jek/assets/img/jek-logo.png" class="bottom-image" alt="JEK Systems">
  </a>
  <span class="copyright">&copy; 2025 JEK Systems</span>
  <div class="bar6">
    <a href="mailto:sales@jeksys.net">sales@jeksys.net</a> |
    <a href="mailto:support@jeksys.net">support@jeksys.net</a> |
    <a href="mailto:vendors@jeksys.net">vendors@jeksys.net</a>
  </div>
</footer>

  <script>
    // Retrieve results and query from sessionStorage
    const stored = sessionStorage.getItem('siteSearchResults');
    const query = sessionStorage.getItem('siteSearchQuery') || '';
    let results = [];

    try {
      results = stored ? JSON.parse(stored) : [];
    } catch {
      results = [];
    }

    const container = document.getElementById('results');

    if (!query) {
      container.innerHTML = '<p class="noresults">No search term provided.</p>';
    } else if (!results || results.length === 0) {
      container.innerHTML = `<p class="noresults">No pages contain "<strong>${query}</strong>".</p>`;
    } else {
      container.innerHTML = results.map(r => 
        `<div class="result"><a href="${r.url}">${r.title}</a></div>`
      ).join('');
    }
  </script>

<script src="/jek/assets/js/cart.js?v=20261015b"></script>
<script src="/jek/assets/js/account.js?v=20261017"></script>

</body>
</html>

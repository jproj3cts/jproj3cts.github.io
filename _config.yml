# GitHub Pages build settings.
#
# Keeps build-only directories out of the published site. The repo is public
# either way — this is tidiness, not security.
exclude:
  - CLAUDE.md                 # working notes for the coding assistant, not a page
  - worker
  - jek-api
  - README.md
  - jek/tools/jekray/         # the tool's source (the slash matters: without it the built page beside it, jekray.html, is excluded too)
  - jek/tools/jekray-dev.html
# served although it starts with a dot: Microsoft checks it to confirm the
# JEKray sign-in app belongs to jeksys.net
include:
  - .well-known
# the old addresses (JEKray2D, before the rename) send people on to the new ones
plugins:
  - jekyll-redirect-from
# the cache-busting stamp on jek.css: every page links /jek/assets/css/jek.css?v={{ site.css_v }}.
# Bump it after changing jek.css (and the copies Jekyll does not build: see the Gotchas in CLAUDE.md).
css_v: "20261017"
